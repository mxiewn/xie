  <!-- đặt data-theme TRƯỚC khi css hiển thị để mở web lúc tối không bị nháy trắng.
       logic phải khớp với js/theme.js -->
  <script>
    (function () {
      var root = document.documentElement;
      var mode = 'system';
      try { mode = localStorage.getItem('xie:theme') || 'system'; } catch (e) {}
      if (['system', 'light', 'dark', 'time'].indexOf(mode) < 0) mode = 'system';
      var theme;
      if (mode === 'light' || mode === 'dark') {
        theme = mode;
      } else if (mode === 'time') {
        var hour;
        try {
          hour = parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', hourCycle: 'h23' }).format(new Date()), 10);
        } catch (e) { hour = new Date().getHours(); }
        theme = (hour >= 18 || hour < 6) ? 'dark' : 'light';
      } else {
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-theme-mode', mode);
      root.style.colorScheme = theme;
    })();
  </script>
